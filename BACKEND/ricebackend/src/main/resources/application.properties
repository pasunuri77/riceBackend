spring.application.name=ricebackend
spring.datasource.url=jdbc:postgresql://localhost:5432/ricebackend
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=ricebackend-dev-secret-key-change-me-please-123456
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173
app.cors.allowed-origin-patterns=http://localhost:*